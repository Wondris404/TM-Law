name: TM-Law checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked ruff check backend scripts tests
      - run: uv run --locked ruff format --check backend scripts tests
      - run: uv run --locked pytest -q -m "not ollama"
      - run: uv run --locked python -m scripts.benchmark --summary --output benchmark-smoke.json
      - if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Windows'
        run: npm.cmd --prefix frontend ci
      - if: runner.os == 'Windows'
        run: npm.cmd --prefix frontend run build
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/start-tm-law.ps1 -Mock -SmokeTest -Port 18080
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
