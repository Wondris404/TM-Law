[project]
name = "tm-law"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psutil>=7.1,<8",
  "pypdf>=6,<7",
  "python-multipart>=0.0.22,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_default_fixture_loop_scope = "function"
markers = ["ollama: opt-in test requiring a local Ollama model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
